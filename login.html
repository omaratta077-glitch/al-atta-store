<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | AL-ATTA</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth-wrap"><form class="auth-card" id="loginForm"><a class="brand" href="index.html">AL-ATTA <b>GOLDEN STORE</b></a><h1>تسجيل الدخول</h1><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button class="gold-btn" type="submit">دخول</button><p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p><p class="muted">تنبيه: تسجيل الدخول هنا تجريبي ومحلي على هذا الجهاز فقط، وليس نظام حسابات آمنًا.</p></form></div><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=JSON.parse(localStorage.getItem('atta_demo_user')||'null');if(u&&u.email===email.value&&u.password===password.value){location.href='index.html'}else alert('بيانات الدخول غير صحيحة أو لا يوجد حساب تجريبي.');});</script></body></html>
