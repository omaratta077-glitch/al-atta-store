<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | AL-ATTA</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth-wrap"><form class="auth-card" id="registerForm"><a class="brand" href="index.html">AL-ATTA <b>GOLDEN STORE</b></a><h1>إنشاء حساب</h1><label>الاسم</label><input id="name" required><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" minlength="6" required><button class="gold-btn" type="submit">إنشاء الحساب</button><p>لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p><p class="muted">هذا نموذج تجريبي فقط؛ لا تحفظ بيانات حقيقية أو كلمات مرور مهمة هنا. يلزم خادم آمن لتفعيل حسابات فعلية.</p></form></div><script>document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('atta_demo_user',JSON.stringify({name:name.value,email:email.value,password:password.value}));alert('تم إنشاء حساب تجريبي على هذا الجهاز.');location.href='index.html'});</script></body></html>
